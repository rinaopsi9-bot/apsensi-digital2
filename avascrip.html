<script>
  var APP = {
    user: null,
    settings: {
      Nama_Sekolah: 'SMK AN NASIR',
      Tahun_Ajaran: '2026/2027',
      Semester: 'Ganjil',
      Batas_Jam_Masuk: '07:15',
      Batas_Jam_Pulang: '15:00',
      Koordinat_Sekolah: '-6.200000,106.816666',
      Radius_Max_Meter: '150',
      Nama_Kepsek: 'Drs. H. Ahmad Nasir, M.Pd',
      Alamat_Sekolah: 'Jl. Pendidikan No. 45'
    },
    activeTab: 'dashboard',
    scanMode: 'Masuk',
    html5QrScanner: null,
    lastScannedCode: '',
    lastScannedTime: 0,
    scanLogsData: [],
    scanLogsOffset: 0,
    masterSiswaCache: [],
    activeSiswaSubTab: 'scan',
    daftarKelas: ['X RPL', 'XI RPL', 'XII RPL'],
    absensiData: [],
    absensiOffset: 0,
    selfieStream: null,
    selfieBase64: '',
    userCoords: null,
    userDistanceMeter: null,
    currentSiswaJurnal: [],
    allUsersCache: [],
    activeUserRoleTab: 'Admin',
    confirmCallback: null
  };

  var IS_GAS = (typeof google !== 'undefined' && google.script && google.script.run);

  function esc(str) {
    return String(str === null || typeof str === 'undefined' ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getTodayISO() {
    var d = new Date();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function startRealtimeClock() {
    function tick() {
      var el = document.getElementById('hero-clock');
      if (!el) return;
      var now = new Date();
      var days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      var hh = ('0' + now.getHours()).slice(-2);
      var mm = ('0' + now.getMinutes()).slice(-2);
      var ss = ('0' + now.getSeconds()).slice(-2);
      el.textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear() + ' • ' + hh + ':' + mm + ':' + ss + ' WIB';
    }
    tick();
    setInterval(tick, 1000);
  }

  function showToast(msg, type) {
    var container = document.getElementById('toast-container');
    if (!container) return;
    var el = document.createElement('div');
    var bg = 'bg-slate-900 text-white';
    if (type === 'success') bg = 'bg-emerald-600 text-white';
    else if (type === 'error') bg = 'bg-rose-600 text-white';
    else if (type === 'info') bg = 'bg-blue-600 text-white';

    el.className = 'pointer-events-auto px-4 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-medium flex items-center justify-between gap-3 fade-in ' + bg;
    el.innerHTML = '<span>' + esc(msg) + '</span>';
    container.appendChild(el);
    setTimeout(function() {
      el.style.opacity = '0';
      el.style.transition = 'opacity 0.25s ease';
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 250);
    }, 3400);
  }

  function openConfirmModal(title, desc, onYes) {
    var titleEl = document.getElementById('confirm-title');
    var descEl = document.getElementById('confirm-desc');
    var modal = document.getElementById('confirm-modal');
    if (titleEl) titleEl.textContent = title;
    if (descEl) descEl.textContent = desc;
    APP.confirmCallback = onYes;
    if (modal) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
  }

  function closeConfirmModal() {
    var modal = document.getElementById('confirm-modal');
    if (modal) {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
    APP.confirmCallback = null;
  }

  function bindConfirmButton() {
    var confirmBtn = document.getElementById('confirm-yes-btn');
    if (confirmBtn && !confirmBtn.getAttribute('data-bound')) {
      confirmBtn.setAttribute('data-bound', 'true');
      confirmBtn.addEventListener('click', function() {
        var cb = APP.confirmCallback;
        closeConfirmModal();
        if (typeof cb === 'function') cb();
      });
    }
  }

  // =========================================================================
  // AUTENTIKASI LOGIN, LOGOUT & RBAC
  // =========================================================================
  function quickFillLogin(u, p) {
    var uEl = document.getElementById('login-username');
    var pEl = document.getElementById('login-pin');
    if (uEl) uEl.value = u;
    if (pEl) pEl.value = p;
    handleLogin();
  }

  function handleLogin() {
    var uEl = document.getElementById('login-username');
    var pEl = document.getElementById('login-pin');
    var btn = document.getElementById('btn-login-submit');
    var username = String(uEl ? uEl.value : '').trim();
    var pin = String(pEl ? pEl.value : '').trim();

    if (!username || !pin) {
      showToast('Username dan PIN wajib diisi.', 'error');
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';
    }

    if (IS_GAS) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Masuk ke Portal';
          }
          if (res && res.status === 'success') {
            APP.user = res.user;
            if (res.settings) APP.settings = res.settings;
            onLoginSuccess();
          } else {
            showToast((res && res.message) ? res.message : 'Login gagal.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Masuk ke Portal';
          }
          showToast('Error: ' + err.message, 'error');
        })
        .loginUser(username, pin);
    } else {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Masuk ke Portal';
      }
      var demoMap = {
        admin: { id: 'USR-0001', nip: '197805122005011001', nama: 'Drs. H. Ahmad Nasir, M.Pd', role: 'Admin', jabatan: 'Kepala Sekolah', kelasBinaan: '-', username: 'admin' },
        tu: { id: 'USR-0002', nip: '198903152014022003', nama: 'Siti Rahmawati, S.E', role: 'TU', jabatan: 'Kepala Tata Usaha', kelasBinaan: '-', username: 'tu' },
        guru: { id: 'USR-0003', nip: '199108202018031005', nama: 'Budi Santoso, S.Kom', role: 'Guru', jabatan: 'Produktif RPL', kelasBinaan: '-', username: 'guru' },
        wali: { id: 'USR-0004', nip: '199311042019032008', nama: 'Dewi Lestari, S.Pd', role: 'WaliKelas', jabatan: 'Bahasa Indonesia', kelasBinaan: 'XI RPL', username: 'wali' }
      };
      var key = username.toLowerCase();
      APP.user = demoMap[key] || { id: 'USR-0099', nip: '-', nama: username, role: 'Guru', jabatan: 'Guru Mapel', kelasBinaan: '-', username: key };
      onLoginSuccess();
    }
  }

  function onLoginSuccess() {
    var modal = document.getElementById('login-modal');
    if (modal) modal.classList.add('hidden');

    var nameEl = document.getElementById('topbar-user-name');
    var roleEl = document.getElementById('topbar-user-role');
    var greetEl = document.getElementById('hero-greeting');
    if (nameEl) nameEl.textContent = APP.user.nama;
    if (roleEl) roleEl.textContent = APP.user.role + (APP.user.kelasBinaan && APP.user.kelasBinaan !== '-' ? ' (' + APP.user.kelasBinaan + ')' : '');
    if (greetEl) greetEl.textContent = 'Selamat datang, ' + APP.user.nama;

    var isAdmin = (APP.user.role === 'Admin');
    var navDesk = document.getElementById('nav-pengaturan-desktop');
    var navMob = document.getElementById('nav-pengaturan-mobile');
    var cardPeng = document.getElementById('card-pengaturan');
    if (navDesk) navDesk.classList.toggle('hidden', !isAdmin);
    if (navMob) navMob.classList.toggle('hidden', !isAdmin);
    if (cardPeng) cardPeng.classList.toggle('hidden', !isAdmin);

    applySettingsToUI();
    refreshAllData();
    showToast('Berhasil masuk sebagai ' + APP.user.nama + ' (' + APP.user.role + ').', 'success');
  }

  function handleLogout() {
    openConfirmModal('Keluar dari Portal', 'Apakah Anda yakin ingin keluar dari sesi saat ini?', function() {
      stopBarcodeCamera();
      stopSelfieCamera();
      APP.user = null;
      var modal = document.getElementById('login-modal');
      if (modal) modal.classList.remove('hidden');
      switchTab('dashboard');
      showToast('Anda telah keluar dari sistem.', 'info');
    });
  }

  function applySettingsToUI() {
    var s = APP.settings;
    var mapFields = {
      'nav-school-name': s.Nama_Sekolah,
      'print-school-name': s.Nama_Sekolah,
      'print-school-addr': s.Alamat_Sekolah,
      'hero-ta-badge': 'TA ' + s.Tahun_Ajaran + ' • ' + s.Semester,
      'hero-batas-jam': 'Masuk: ' + s.Batas_Jam_Masuk + ' | Pulang: ' + s.Batas_Jam_Pulang + ' WIB',
      'radius-limit-tag': 'Maks ' + (s.Radius_Max_Meter || '150') + 'm'
    };
    for (var id in mapFields) {
      var el = document.getElementById(id);
      if (el) el.textContent = mapFields[id];
    }

    var inputFields = {
      'set-nama-sekolah': s.Nama_Sekolah,
      'set-tahun-ajaran': s.Tahun_Ajaran,
      'set-semester': s.Semester,
      'set-batas-jam': s.Batas_Jam_Masuk,
      'set-batas-pulang': s.Batas_Jam_Pulang,
      'set-koordinat': s.Koordinat_Sekolah,
      'set-radius': s.Radius_Max_Meter,
      'set-kepsek': s.Nama_Kepsek,
      'set-alamat': s.Alamat_Sekolah
    };
    for (var inpId in inputFields) {
      var inp = document.getElementById(inpId);
      if (inp) inp.value = inputFields[inpId] || '';
    }
  }

  // =========================================================================
  // NAVIGASI TAB & PENCARIAN GLOBAL
  // =========================================================================
  function switchTab(tabName) {
    if (tabName === 'pengaturan' && APP.user && APP.user.role !== 'Admin') {
      showToast('Akses ditolak. Menu Pengaturan khusus Super Admin.', 'error');
      return;
    }
    if (APP.activeTab === 'scanner' && tabName !== 'scanner') stopBarcodeCamera();
    if (APP.activeTab === 'absensi' && tabName !== 'absensi') stopSelfieCamera();

    APP.activeTab = tabName;
    var sections = document.querySelectorAll('.tab-section');
    for (var i = 0; i < sections.length; i++) {
      sections[i].classList.add('hidden');
    }
    var targetSec = document.getElementById('tab-' + tabName);
    if (targetSec) targetSec.classList.remove('hidden');

    var navBtns = document.querySelectorAll('.nav-btn');
    for (var j = 0; j < navBtns.length; j++) {
      var btn = navBtns[j];
      var isAct = (btn.getAttribute('data-tab') === tabName);
      if (btn.classList.contains('shrink-0')) {
        btn.className = isAct
          ? 'nav-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white'
          : 'nav-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200';
      } else {
        btn.className = isAct
          ? 'nav-btn px-3.5 py-2 rounded-full text-sm font-semibold text-blue-600 bg-blue-50 transition'
          : 'nav-btn px-3.5 py-2 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition';
      }
    }

    if (tabName === 'scanner') loadScanGerbangLogs(true);
    else if (tabName === 'absensi') {
      refreshUserGPS();
      loadAbsensiPegawai(true);
    } else if (tabName === 'rekap') {
      loadRekapPeriodik();
    } else if (tabName === 'pengaturan') {
      loadUsersList();
    }
  }

  function executeGlobalSearch() {
    var qEl = document.getElementById('global-search-input');
    var q = String(qEl ? qEl.value : '').trim();
    if (!q) {
      showToast('Ketik kata kunci pencarian terlebih dahulu.', 'info');
      return;
    }
    switchTab('absensi');
    var searchBox = document.getElementById('filter-absen-search');
    if (searchBox) searchBox.value = q;
    loadAbsensiPegawai(true);
  }

  function refreshAllData() {
    if (!APP.user) return;
    if (IS_GAS) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            if (res.settings) {
              APP.settings = res.settings;
              applySettingsToUI();
            }
            renderDashboardSummary(res.summary);
          }
        })
        .getDashboardSummary(APP.user.role, APP.user.id, APP.user.kelasBinaan);
    } else {
      renderDashboardSummary({
        hadirPegawaiToday: 4,
        totalPegawaiAktif: 5,
        jurnalToday: 3,
        siswaScanHadirToday: 28,
        siswaScanPulangToday: 12,
        siswaTidakHadirToday: 2,
        myTodayStatus: null,
        daftarKelas: ['X RPL', 'XI RPL', 'XII RPL']
      });
    }
  }

  function renderDashboardSummary(sum) {
    document.getElementById('stat-pegawai-hadir').textContent = sum.hadirPegawaiToday + ' / ' + sum.totalPegawaiAktif;
    document.getElementById('stat-jurnal-today').textContent = String(sum.jurnalToday);
    document.getElementById('stat-siswa-scan').textContent = (sum.siswaScanHadirToday || 0) + ' / ' + (sum.siswaScanPulangToday || 0);
    document.getElementById('stat-siswa-absen').textContent = String(sum.siswaTidakHadirToday);

    var myBadge = document.getElementById('hero-my-status');
    if (sum.myTodayStatus) {
      var pulangTxt = (sum.myTodayStatus.jamPulang && sum.myTodayStatus.jamPulang !== '-') ? ' | Pulang ' + sum.myTodayStatus.jamPulang : '';
      myBadge.textContent = sum.myTodayStatus.status + ' (' + sum.myTodayStatus.jamMasuk + pulangTxt + ')';
      myBadge.className = 'px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/30 text-emerald-300 font-semibold';
    } else {
      myBadge.textContent = 'Belum absen hari ini';
      myBadge.className = 'px-3 py-1 rounded-full bg-amber-500/20 border border-amber-400/30 text-amber-300 font-semibold';
    }

    if (sum.daftarKelas && sum.daftarKelas.length > 0) {
      APP.daftarKelas = sum.daftarKelas;
      populateKelasDropdowns();
    }
  }

  function populateKelasDropdowns() {
    var selJurnal = document.getElementById('jurnal-kelas');
    var selPeriodik = document.getElementById('periodik-kelas');
    var selScan = document.getElementById('filter-scan-kelas');
    var selIzinSw = document.getElementById('izin-sw-kelas');
    var htmlJ = '<option value="">-- Pilih Kelas --</option>';
    var htmlR = '<option value="Semua">Semua Kelas</option>';

    var kelasList = (APP.daftarKelas && APP.daftarKelas.length) ? APP.daftarKelas : ['X RPL', 'XI RPL', 'XII RPL'];
    for (var i = 0; i < kelasList.length; i++) {
      var k = kelasList[i];
      htmlJ += '<option value="' + esc(k) + '">' + esc(k) + '</option>';
      htmlR += '<option value="' + esc(k) + '">' + esc(k) + '</option>';
    }
    if (selJurnal) selJurnal.innerHTML = htmlJ;
    if (selPeriodik) selPeriodik.innerHTML = htmlR;
    if (selScan) selScan.innerHTML = htmlR;
    if (selIzinSw) selIzinSw.innerHTML = htmlJ;
    var selSiswaList = document.getElementById('filter-siswa-kelas-list');
    if (selSiswaList) selSiswaList.innerHTML = htmlR;
  }

  // =========================================================================
  // SUB-TAB DAFTAR SISWA PER TAHUN, KENAIKAN KELAS MASSAL & CRUD SISWA
  // =========================================================================
  function switchSiswaSubTab(subName) {
    APP.activeSiswaSubTab = subName;
    var btnScan = document.getElementById('subtab-siswa-scan');
    var btnDaftar = document.getElementById('subtab-siswa-daftar');
    var panelScan = document.getElementById('panel-siswa-scan');
    var panelDaftar = document.getElementById('panel-siswa-daftar');

    if (subName === 'daftar') {
      stopBarcodeCamera();
      btnDaftar.className = 'flex-1 py-2 px-4 rounded-xl text-xs sm:text-sm font-bold bg-white text-blue-600 shadow-sm transition';
      btnScan.className = 'flex-1 py-2 px-4 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 transition';
      panelScan.classList.add('hidden');
      panelDaftar.classList.remove('hidden');
      loadMasterSiswaList();
    } else {
      btnScan.className = 'flex-1 py-2 px-4 rounded-xl text-xs sm:text-sm font-bold bg-white text-blue-600 shadow-sm transition';
      btnDaftar.className = 'flex-1 py-2 px-4 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 transition';
      panelDaftar.classList.add('hidden');
      panelScan.classList.remove('hidden');
    }
  }

  function loadMasterSiswaList() {
    var tahunVal = String(document.getElementById('filter-siswa-tahun').value || 'Semua');
    var kelasVal = String(document.getElementById('filter-siswa-kelas-list').value || 'Semua');
    var searchVal = String(document.getElementById('filter-siswa-search').value || '').trim();
    var tbody = document.getElementById('tbody-master-siswa');

    tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-400 text-xs">Memuat daftar siswa per tahun...</td></tr>';

    if (IS_GAS) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            APP.masterSiswaCache = res.items || [];
            if (res.daftarTahun && res.daftarTahun.length > 0) {
              var selThn = document.getElementById('filter-siswa-tahun');
              var currentSel = selThn.value;
              var optHtml = '<option value="Semua">Semua Tahun</option>';
              for (var t = 0; t < res.daftarTahun.length; t++) {
                var th = res.daftarTahun[t];
                optHtml += '<option value="' + esc(th) + '">TA ' + esc(th) + '</option>';
              }
              selThn.innerHTML = optHtml;
              selThn.value = currentSel;
            }
            renderMasterSiswaTable();
          }
        })
        .getMasterSiswaList({
          tahunAjaran: tahunVal,
          kelas: kelasVal,
          search: searchVal
        });
    } else {
      if (!APP.masterSiswaCache.length) {
        APP.masterSiswaCache = [
          { id: 'SIS-0001', nisn: '0091234501', nama: 'Fajar Ramadhan', kelas: 'X RPL', jurusan: 'Rekayasa Perangkat Lunak', jk: 'L', tahunAjaran: '2026/2027', status: 'Aktif' },
          { id: 'SIS-0004', nisn: '0081234504', nama: 'Aditya Nugraha', kelas: 'XI RPL', jurusan: 'Rekayasa Perangkat Lunak', jk: 'L', tahunAjaran: '2026/2027', status: 'Aktif' },
          { id: 'SIS-0008', nisn: '0071234508', nama: 'Intan Nuraini', kelas: 'XII RPL', jurusan: 'Rekayasa Perangkat Lunak', jk: 'P', tahunAjaran: '2025/2026', status: 'Aktif' }
        ];
      }
      renderMasterSiswaTable();
    }
  }

  function renderMasterSiswaTable() {
    var tbody = document.getElementById('tbody-master-siswa');
    var sumEl = document.getElementById('siswa-tahun-summary');
    var tahunVal = String(document.getElementById('filter-siswa-tahun').value || 'Semua');
    var kelasVal = String(document.getElementById('filter-siswa-kelas-list').value || 'Semua');
    var searchVal = String(document.getElementById('filter-siswa-search').value || '').trim().toLowerCase();

    var list = APP.masterSiswaCache;
    if (!IS_GAS) {
      list = APP.masterSiswaCache.filter(function(s) {
        if (tahunVal !== 'Semua' && s.tahunAjaran !== tahunVal) return false;
        if (kelasVal !== 'Semua' && s.kelas !== kelasVal) return false;
        if (searchVal && (s.nama + ' ' + s.nisn + ' ' + s.kelas).toLowerCase().indexOf(searchVal) === -1) return false;
        return true;
      });
    }

    sumEl.textContent = 'Menampilkan ' + list.length + ' siswa' + (tahunVal !== 'Semua' ? ' (TA ' + tahunVal + ')' : '');

    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-400 text-xs">Tidak ada data siswa pada filter tahun/kelas ini.</td></tr>';
      return;
    }

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      var isAktif = (s.status === 'Aktif');
      var badgeCls = isAktif ? 'bg-emerald-50 text-emerald-700' : (s.status === 'Lulus' ? 'bg-indigo-50 text-indigo-700' : 'bg-rose-50 text-rose-700');
      html += '<tr class="hover:bg-slate-50 transition">' +
        '<td class="py-3 px-3"><div class="font-mono font-bold text-xs text-slate-800">' + esc(s.nisn) + '</div><div class="text-[11px] text-slate-400">' + esc(s.id) + '</div></td>' +
        '<td class="py-3 px-3"><div class="font-semibold text-slate-900">' + esc(s.nama) + '</div><div class="text-[11px] text-slate-500">Gender: ' + esc(s.jk === 'P' ? 'Perempuan' : 'Laki-laki') + '</div></td>' +
        '<td class="py-3 px-3"><div class="text-xs font-bold text-blue-600">' + esc(s.kelas) + '</div><div class="text-[11px] text-slate-500">' + esc(s.jurusan) + '</div></td>' +
        '<td class="py-3 px-3"><span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 text-xs font-bold">' + esc(s.tahunAjaran) + '</span></td>' +
        '<td class="py-3 px-3"><span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ' + badgeCls + '">' + esc(s.status) + '</span></td>' +
        '<td class="py-3 px-3 text-right">' +
          '<div class="inline-flex items-center gap-1.5">' +
            '<button type="button" onclick="openSiswaFormModal(\'' + esc(s.id) + '\')" class="px-3 py-1 rounded-full bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold transition">Edit</button>' +
            '<button type="button" onclick="confirmDeleteSiswa(\'' + esc(s.id) + '\', \'' + esc(s.nama) + '\')" class="px-3 py-1 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold transition">Hapus</button>' +
          '</div>' +
        '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }

  function openPromoteSiswaModal() {
    document.getElementById('promote-dst-tahun').value = APP.settings.Tahun_Ajaran || '2026/2027';
    autoSuggestTargetKelas();
    var modal = document.getElementById('promote-siswa-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  function closePromoteSiswaModal() {
    var modal = document.getElementById('promote-siswa-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');

  function autoSuggestTargetKelas() {

  function playBeepTone(isSuccess) {
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      var ctx = new AudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = isSuccess ? 880 : 300;
      gain.gain.value = 0.12;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      setTimeout(function() {
        osc.stop();
        ctx.close();
      }, isSuccess ? 140 : 280);
    } catch (e) {}
  }

  function startBarcodeCamera() {
    if (typeof Html5Qrcode === 'undefined') {
      showToast('Library kamera belum siap. Gunakan input manual NISN di bawah.', 'error');
      return;
    }
    if (APP.html5QrScanner) return;

    document.getElementById('camera-placeholder').classList.add('hidden');
    document.getElementById('btn-start-camera').classList.add('hidden');
    document.getElementById('btn-stop-camera').classList.remove('hidden');

    APP.html5QrScanner = new Html5Qrcode('qr-reader');
    APP.html5QrScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 230, height: 150 } },
      function(decodedText) {
        var nowMs = Date.now();
        if (decodedText === APP.lastScannedCode && (nowMs - APP.lastScannedTime) < 3000) {
          return;
        }
        APP.lastScannedCode = decodedText;
        APP.lastScannedTime = nowMs;
        processBarcodeScan(decodedText);
      },
      function() {}
    ).catch(function(err) {
      showToast('Gagal mengakses kamera: ' + err, 'error');
      stopBarcodeCamera();
    });
  }

        APP.html5QrScanner.clear();
        APP.html5QrScanner = null;

        APP.html5QrScanner = null;

        .withFailureHandler(function(err) {
          playBeepTone(false);

        .scanBarcodeSiswa(String(nisnCode), String(mode), String(petugas));

  // =========================================================================
  // MODUL ABSENSI PEGAWAI (SELFIE WAJAH + RADIUS GPS + AJUKAN IZIN)
  // =========================================================================
  function calcClientDistanceMeters(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return Math.round(R * c);
  }

  function refreshUserGPS() {
    var pill = document.getElementById('gps-status-pill');
    var infoText = document.getElementById('radius-detail-text');
    if (!navigator.geolocation) {
      pill.textContent = 'GPS: Tidak Didukung Browser';
      infoText.textContent = 'Browser perangkat tidak mendukung pelacakan GPS.';
      return;
    }

    pill.textContent = 'GPS: Melacak titik...';
    navigator.geolocation.getCurrentPosition(function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      APP.userCoords = { lat: lat, lng: lng };

      var centerParts = String(APP.settings.Koordinat_Sekolah || '-6.200000,106.816666').split(',');
      var cLat = parseFloat(centerParts[0]);
      var cLng = parseFloat(centerParts[1]);
      var maxR = parseInt(APP.settings.Radius_Max_Meter, 10) || 150;

      var dist = (!isNaN(cLat) && !isNaN(cLng)) ? calcClientDistanceMeters(lat, lng, cLat, cLng) : 0;
      APP.userDistanceMeter = dist;

      if (dist <= maxR) {
        pill.className = 'px-3.5 py-1.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold';
        pill.textContent = 'GPS Valid (' + dist + 'm)';
        infoText.textContent = 'Posisi Anda berada di dalam area sekolah (' + dist + ' meter dari titik pusat).';
      } else {
        pill.className = 'px-3.5 py-1.5 rounded-full bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold';
        pill.textContent = 'Di Luar Radius (' + dist + 'm)';
        infoText.textContent = 'Jarak Anda ' + dist + 'm dari sekolah (melebihi batas ' + maxR + 'm). Gunakan opsi Ajukan Izin jika dinas luar.';
      }
    }, function(err) {
      pill.className = 'px-3.5 py-1.5 rounded-full bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold';
      pill.textContent = 'GPS Ditolak / Mati';
      infoText.textContent = 'Izinkan akses lokasi (GPS) pada browser HP/laptop Anda untuk absen Masuk/Pulang.';
    }, { enableHighAccuracy: true, timeout: 10000 });
  }

  function startSelfieCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast('Kamera depan tidak didukung pada browser ini.', 'error');
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 } }, audio: false })
      .then(function(stream) {
        APP.selfieStream = stream;
        var video = document.getElementById('selfie-video');
        video.srcObject = stream;
        video.classList.remove('hidden');
        document.getElementById('selfie-preview').classList.add('hidden');
        document.getElementById('selfie-placeholder').classList.add('hidden');
        document.getElementById('btn-open-selfie').classList.add('hidden');
        document.getElementById('btn-capture-selfie').classList.remove('hidden');
        document.getElementById('btn-retake-selfie').classList.add('hidden');
      })
      .catch(function(err) {
        showToast('Gagal membuka kamera wajah: ' + err.message, 'error');
      });
  }

  function stopSelfieCamera() {
    if (APP.selfieStream) {
      var tracks = APP.selfieStream.getTracks();
      for (var i = 0; i < tracks.length; i++) tracks[i].stop();
      APP.selfieStream = null;
    }
  }

  function captureSelfiePhoto() {
    var video = document.getElementById('selfie-video');
    var canvas = document.getElementById('selfie-canvas');
    var preview = document.getElementById('selfie-preview');
    if (!video || !video.videoWidth) return;

    canvas.width = 400;
    canvas.height = Math.round((video.videoHeight / video.videoWidth) * 400);
    var ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    APP.selfieBase64 = canvas.toDataURL('image/jpeg', 0.72);
    preview.src = APP.selfieBase64;
    preview.classList.remove('hidden');
    video.classList.add('hidden');
    stopSelfieCamera();

    var badge = document.getElementById('selfie-badge');
    badge.className = 'px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-bold';
    badge.textContent = 'Wajah Terambil';

    document.getElementById('btn-capture-selfie').classList.add('hidden');
    document.getElementById('btn-retake-selfie').classList.remove('hidden');
    showToast('Foto wajah berhasil diambil!', 'success');
  }

  function retakeSelfiePhoto() {
    APP.selfieBase64 = '';
    var badge = document.getElementById('selfie-badge');
    badge.className = 'px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[11px] font-semibold';
    badge.textContent = 'Belum Foto';
    startSelfieCamera();
  }

  function handleSubmitAbsensiPegawai() {
    if (!APP.user) return;
    var tipeAksi = String(document.getElementById('absen-tipe').value);
    var keterangan = String(document.getElementById('absen-keterangan').value || '-').trim();
    var isHadirFisik = (tipeAksi === 'Masuk' || tipeAksi === 'Pulang');

    if (isHadirFisik) {
      if (!APP.selfieBase64) {
        showToast('Ambil foto selfie wajah Anda terlebih dahulu!', 'error');
        return;
      }
      if (!APP.userCoords) {
        showToast('Koordinat GPS belum terbaca. Klik tombol Cek GPS.', 'error');
        refreshUserGPS();
        return;
      }
      var maxR = parseInt(APP.settings.Radius_Max_Meter, 10) || 150;
      if (APP.userDistanceMeter !== null && APP.userDistanceMeter > maxR) {
        showToast('Anda berada di luar radius sekolah (' + APP.userDistanceMeter + 'm > ' + maxR + 'm).', 'error');
        return;
      }
    } else if (!keterangan || keterangan === '-') {
      showToast('Tuliskan alasan pada kolom keterangan untuk pengajuan ' + tipeAksi + '.', 'error');
      return;
    }

    var btn = document.getElementById('btn-submit-absen');
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    var payload = {
      idUser: String(APP.user.id),
      nama: String(APP.user.nama),
      role: String(APP.user.role),
      tipeAksi: tipeAksi,
      keterangan: keterangan,
      lat: APP.userCoords ? APP.userCoords.lat : '',
      lng: APP.userCoords ? APP.userCoords.lng : '',
      fotoBase64: isHadirFisik ? APP.selfieBase64 : ''
    };

    if (IS_GAS) {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          toggleAbsenModeUI();
          if (res && res.status === 'success') {
            showToast(res.message, 'success');
            document.getElementById('absen-keterangan').value = '';
            APP.selfieBase64 = '';
            document.getElementById('selfie-preview').classList.add('hidden');
            document.getElementById('selfie-placeholder').classList.remove('hidden');
            document.getElementById('btn-open-selfie').classList.remove('hidden');
            document.getElementById('btn-retake-selfie').classList.add('hidden');
            loadAbsensiPegawai(true);
            refreshAllData();
          } else {
            showToast((res && res.message) ? res.message : 'Gagal mengirim absensi.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          toggleAbsenModeUI();
          showToast('Error: ' + err.message, 'error');
        })
        .submitAbsensiPegawai(payload);
    } else {
      setTimeout(function() {
        btn.disabled = false;
        toggleAbsenModeUI();
        var nowTime = new Date().toTimeString().slice(0, 8);
        APP.absensiData.unshift({
          id: 'ABS-000' + (APP.absensiData.length + 1),
          tanggal: getTodayISO(),
          jamMasuk: tipeAksi === 'Masuk' ? nowTime : '-',
          jamPulang: tipeAksi === 'Pulang' ? nowTime : '-',
          idUser: APP.user.id,
          nama: APP.user.nama,
          role: APP.user.role,
          status: tipeAksi === 'Masuk' ? 'Hadir' : tipeAksi,
          keterangan: keterangan,
          validasi: tipeAksi === 'Masuk' ? 'Tervalidasi' : 'Menunggu',
          fotoSelfie: isHadirFisik ? 'Preview_Selfie' : '-',
          jarakMeter: APP.userDistanceMeter !== null ? String(APP.userDistanceMeter) : '15'
        });
        renderAbsensiPegawaiTable(false);
        refreshAllData();
        showToast('Absensi ' + tipeAksi + ' berhasil dicatat (Mode Preview).', 'success');
      }, 200);
    }
  }

  function loadAbsensiPegawai(reset) {
    if (reset) {
      APP.absensiOffset = 0;
      APP.absensiData = [];
    }
    var params = {
      search: String(document.getElementById('filter-absen-search').value || '').trim(),
      tanggal: String(document.getElementById('filter-absen-tanggal').value || '').trim(),
      roleFilter: String(document.getElementById('filter-absen-role').value || 'Semua'),
      limit: 15,
      offset: APP.absensiOffset
    };

    if (IS_GAS) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            APP.absensiData = reset ? res.items : APP.absensiData.concat(res.items);
            APP.absensiOffset = APP.absensiData.length;
            renderAbsensiPegawaiTable(res.hasMore);
          }
        })
        .getAbsensiPegawai(params);
    } else {
      renderAbsensiPegawaiTable(false);
    }
  }

  function renderAbsensiPegawaiTable(hasMore) {
    var tbody = document.getElementById('tbody-absensi-pegawai');
    var wrap = document.getElementById('absensi-loadmore-wrap');
    if (!APP.absensiData.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-400 text-sm">Belum ada data kehadiran pegawai.</td></tr>';
      wrap.classList.add('hidden');
      return;
    }

    var canValidate = APP.user && (APP.user.role === 'Admin' || APP.user.role === 'TU');
    var html = '';
    for (var i = 0; i < APP.absensiData.length; i++) {
      var r = APP.absensiData[i];
      var actionHtml = renderStatusBadge(r.validasi);
      if (canValidate && r.validasi === 'Menunggu') {
        actionHtml = '<div class="flex items-center gap-1.5">' +
          '<button type="button" onclick="handleValidasiTU(\'' + esc(r.id) + '\',\'Tervalidasi\')" class="px-2.5 py-1 rounded-full bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700">Setujui</button>' +
          '<button type="button" onclick="handleValidasiTU(\'' + esc(r.id) + '\',\'Ditolak\')" class="px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 text-xs font-semibold hover:bg-rose-200">Tolak</button>' +
          '</div>';
      }
      var fotoLink = (r.fotoSelfie && r.fotoSelfie !== '-' && r.fotoSelfie.indexOf('http') === 0)
        ? '<a href="' + esc(r.fotoSelfie) + '" target="_blank" class="text-blue-600 underline font-semibold">Lihat Wajah</a>'
        : esc(r.fotoSelfie || '-');

      html += '<tr class="hover:bg-slate-50/80 transition">' +
        '<td class="py-3.5 px-4"><div class="font-bold text-xs text-slate-800">' + esc(r.id) + '</div><div class="text-xs text-slate-500">' + esc(r.tanggal) + '</div></td>' +
        '<td class="py-3.5 px-4"><div class="font-semibold text-slate-900">' + esc(r.nama) + '</div><div class="text-xs text-slate-500">' + esc(r.role) + ' - ' + esc(r.keterangan) + '</div></td>' +
        '<td class="py-3.5 px-4 text-xs font-medium text-slate-700">Masuk: <b>' + esc(r.jamMasuk) + '</b><br>Pulang: <b>' + esc(r.jamPulang) + '</b></td>' +
        '<td class="py-3.5 px-4 text-xs text-slate-600"><div>Jarak: <b>' + esc(r.jarakMeter || '-') + 'm</b></div><div>' + fotoLink + '</div></td>' +
        '<td class="py-3.5 px-4">' + renderStatusBadge(r.status) + '</td>' +
        '<td class="py-3.5 px-4">' + actionHtml + '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
    if (hasMore) wrap.classList.remove('hidden');
    else wrap.classList.add('hidden');
  }

  function fillCurrentCoordToSettings() {

      showToast('Browser tidak mendukung GPS.', 'error');
      return;
    }
    showToast('Mengambil titik koordinat GPS Anda...', 'info');
    navigator.geolocation.getCurrentPosition(function(pos) {
      var coordStr = pos.coords.latitude.toFixed(6) + ',' + pos.coords.longitude.toFixed(6);
      document.getElementById('set-koordinat').value = coordStr;
      showToast('Koordinat GPS sekolah diperbarui: ' + coordStr, 'success');
    }, function(err) {
      showToast('Gagal mengambil GPS: ' + err.message, 'error');
    }, { enableHighAccuracy: true });
  }

  function handleSaveSettings() {

      Nama_Kepsek: String(document.getElementById('set-kepsek').value).trim(),
      Alamat_Sekolah: String(document.getElementById('set-alamat').value).trim()
    };

    var btn = document.getElementById('btn-save-settings');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    if (IS_GAS) {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.textContent = 'Simpan Pengaturan';
          if (res && res.status === 'success') {
            APP.settings = res.settings;
            applySettingsToUI();
            showToast(res.message, 'success');
          }
        })
        .saveSettings(payload);
    } else {
      btn.disabled = false;
      btn.textContent = 'Simpan Pengaturan';
      APP.settings = payload;
      applySettingsToUI();
      showToast('Pengaturan disimpan (Mode Preview).', 'success');
    }
  }

  function loadUsersList() {
    var tbody = document.getElementById('tbody-users-list');
    tbody.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-400 text-xs">Memuat daftar pengguna...</td></tr>';

    if (IS_GAS) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            APP.allUsersCache = res.items || [];
            renderUsersByActiveRole();
          }
        })
        .getUsersList('');
    } else {
      if (!APP.allUsersCache.length) {
        APP.allUsersCache = [
          { id: 'USR-0001', nip: '197805122005011001', nama: 'Drs. H. Ahmad Nasir, M.Pd', role: 'Admin', jabatan: 'Kepala Sekolah', kelasBinaan: '-', username: 'admin', status: 'Aktif' },
          { id: 'USR-0002', nip: '198903152014022003', nama: 'Siti Rahmawati, S.E', role: 'TU', jabatan: 'Kepala Tata Usaha', kelasBinaan: '-', username: 'tu', status: 'Aktif' },
          { id: 'USR-0003', nip: '199108202018031005', nama: 'Budi Santoso, S.Kom', role: 'Guru', jabatan: 'Produktif RPL', kelasBinaan: '-', username: 'guru', status: 'Aktif' },
          { id: 'USR-0004', nip: '199311042019032008', nama: 'Dewi Lestari, S.Pd', role: 'WaliKelas', jabatan: 'Bahasa Indonesia', kelasBinaan: 'XI RPL', username: 'wali', status: 'Aktif' }
        ];
      }
      renderUsersByActiveRole();
    }
  }

  function switchUserRoleTab(roleName) {
    APP.activeUserRoleTab = roleName;
    var btns = document.querySelectorAll('.role-tab-btn');
    for (var i = 0; i < btns.length; i++) {
      var isTarget = (btns[i].getAttribute('data-role-tab') === roleName);
      btns[i].className = isTarget
        ? 'role-tab-btn flex-1 py-2 px-3 rounded-xl text-xs font-bold bg-white text-blue-600 shadow-sm transition'
        : 'role-tab-btn flex-1 py-2 px-3 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition';
    }
    renderUsersByActiveRole();
  }

  function renderUsersByActiveRole() {
    var counts = { Admin: 0, TU: 0, Guru: 0, WaliKelas: 0 };
    var filtered = [];

    for (var i = 0; i < APP.allUsersCache.length; i++) {
      var u = APP.allUsersCache[i];
      if (typeof counts[u.role] !== 'undefined') counts[u.role]++;
      if (u.role === APP.activeUserRoleTab) {
        filtered.push(u);
      }
    }

    document.getElementById('count-role-Admin').textContent = String(counts.Admin);
    document.getElementById('count-role-TU').textContent = String(counts.TU);
    document.getElementById('count-role-Guru').textContent = String(counts.Guru);
    document.getElementById('count-role-WaliKelas').textContent = String(counts.WaliKelas);

    var tbody = document.getElementById('tbody-users-list');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-400 text-xs">Belum ada akun terdaftar pada peran ' + esc(APP.activeUserRoleTab) + '.</td></tr>';
      return;
    }

    var html = '';
    for (var j = 0; j < filtered.length; j++) {
      var item = filtered[j];
      var isAktif = (item.status === 'Aktif');
      var infoSub = (item.role === 'WaliKelas' && item.kelasBinaan && item.kelasBinaan !== '-')
        ? esc(item.jabatan) + ' &bull; <b class="text-blue-600">Kelas ' + esc(item.kelasBinaan) + '</b>'
        : esc(item.jabatan);

      html += '<tr class="hover:bg-slate-50 transition">' +
        '<td class="py-3 px-3"><div class="font-semibold text-slate-900">' + esc(item.nama) + '</div><div class="text-[11px] text-slate-500">NIP: ' + esc(item.nip || '-') + '</div></td>' +
        '<td class="py-3 px-3 text-xs text-slate-700">' + infoSub + '</td>' +
        '<td class="py-3 px-3 font-mono text-xs text-slate-600">' + esc(item.username) + '</td>' +
        '<td class="py-3 px-3">' +
          '<button type="button" onclick="handleToggleUser(\'' + esc(item.id) + '\')" class="px-2.5 py-1 rounded-full text-xs font-semibold ' + (isAktif ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700') + '">' + esc(item.status) + '</button>' +
        '</td>' +
        '<td class="py-3 px-3 text-right">' +
          '<div class="inline-flex items-center gap-1.5">' +
            '<button type="button" onclick="openUserFormModal(\'' + esc(item.id) + '\')" class="px-3 py-1 rounded-full bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold transition">Edit</button>' +
            '<button type="button" onclick="confirmDeleteUser(\'' + esc(item.id) + '\', \'' + esc(item.nama) + '\')" class="px-3 py-1 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold transition">Hapus</button>' +
          '</div>' +
        '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }

  function toggleKelasBinaanField() {
    var roleVal = String(document.getElementById('form-user-role').value);
    var kelasSel = document.getElementById('form-user-kelas');
    if (roleVal !== 'WaliKelas') {
      kelasSel.value = '-';
    } else if (kelasSel.value === '-') {
      kelasSel.value = 'X RPL';
    }
  }

  function openUserFormModal(idUser) {
    var modal = document.getElementById('user-form-modal');
    var titleEl = document.getElementById('user-modal-title');
    var pinInput = document.getElementById('form-user-pin');

    if (idUser) {
      var found = null;
      for (var i = 0; i < APP.allUsersCache.length; i++) {
        if (APP.allUsersCache[i].id === idUser) {
          found = APP.allUsersCache[i];
          break;
        }
      }
      if (!found) return;
      titleEl.textContent = 'Edit Akun Pengguna';
      document.getElementById('form-user-id').value = found.id;
      document.getElementById('form-user-role').value = found.role;
      document.getElementById('form-user-nama').value = found.nama;
      document.getElementById('form-user-nip').value = found.nip === '-' ? '' : found.nip;
      document.getElementById('form-user-status').value = found.status || 'Aktif';
      document.getElementById('form-user-jabatan').value = found.jabatan === '-' ? '' : found.jabatan;
      document.getElementById('form-user-kelas').value = found.kelasBinaan || '-';
      document.getElementById('form-user-username').value = found.username;
      pinInput.value = '';
      pinInput.required = false;
      pinInput.placeholder = 'Kosongkan jika tidak diubah';
    } else {
      titleEl.textContent = 'Tambah Akun Pengguna';
      document.getElementById('form-user-id').value = '';
      document.getElementById('form-user-role').value = APP.activeUserRoleTab || 'Guru';
      document.getElementById('form-user-nama').value = '';
      document.getElementById('form-user-nip').value = '';
      document.getElementById('form-user-status').value = 'Aktif';
      document.getElementById('form-user-jabatan').value = '';
      document.getElementById('form-user-kelas').value = (APP.activeUserRoleTab === 'WaliKelas') ? 'X RPL' : '-';
      document.getElementById('form-user-username').value = '';
      pinInput.value = '1234';
      pinInput.required = true;
      pinInput.placeholder = 'Default: 1234';
    }

    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  function closeUserFormModal() {
    var modal = document.getElementById('user-form-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function handleSaveUserForm() {
    var idVal = String(document.getElementById('form-user-id').value || '').trim();
    var payload = {
      id: idVal,
      nama: String(document.getElementById('form-user-nama').value).trim(),
      nip: String(document.getElementById('form-user-nip').value || '-').trim(),
      role: String(document.getElementById('form-user-role').value),
      jabatan: String(document.getElementById('form-user-jabatan').value || '-').trim(),
      kelasBinaan: String(document.getElementById('form-user-kelas').value || '-').trim(),
      username: String(document.getElementById('form-user-username').value).trim(),
      pin: String(document.getElementById('form-user-pin').value || '').trim(),
      status: String(document.getElementById('form-user-status').value || 'Aktif')
    };

    var btn = document.getElementById('btn-save-user-modal');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    if (IS_GAS) {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.textContent = 'Simpan Akun Pengguna';
          if (res && res.status === 'success') {
            showToast(res.message, 'success');
            closeUserFormModal();
            switchUserRoleTab(payload.role);
            loadUsersList();
          } else {
            showToast((res && res.message) ? res.message : 'Gagal menyimpan akun.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = 'Simpan Akun Pengguna';
          showToast('Error: ' + err.message, 'error');
        })
        .saveUserAccount(payload);
    } else {
      btn.disabled = false;
      btn.textContent = 'Simpan Akun Pengguna';
      if (idVal) {
        for (var i = 0; i < APP.allUsersCache.length; i++) {
          if (APP.allUsersCache[i].id === idVal) {
            APP.allUsersCache[i] = {
              id: idVal, nip: payload.nip, nama: payload.nama, role: payload.role,
              jabatan: payload.jabatan, kelasBinaan: payload.kelasBinaan,
              username: payload.username, status: payload.status
            };
            break;
          }
        }
        showToast('Akun ' + payload.nama + ' diperbarui (Mode Preview).', 'success');
      } else {
        payload.id = 'USR-00' + (APP.allUsersCache.length + 10);
        APP.allUsersCache.push(payload);
        showToast('Akun ' + payload.nama + ' ditambahkan (Mode Preview).', 'success');
      }
      closeUserFormModal();
      switchUserRoleTab(payload.role);
    }
  }

  function confirmDeleteUser(idUser, namaUser) {
    if (APP.user && APP.user.id === idUser) {
      showToast('Tidak dapat menghapus akun yang sedang digunakan login saat ini.', 'error');
      return;
    }
    openConfirmModal('Hapus Akun Pengguna', 'Yakin ingin menghapus akun "' + namaUser + '" secara permanen?', function() {
      if (IS_GAS) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.status === 'success') {
              showToast(res.message, 'success');
              loadUsersList();
            } else {
              showToast((res && res.message) ? res.message : 'Gagal menghapus akun.', 'error');
            }
          })
          .deleteUserAccount(String(idUser));
      } else {
        APP.allUsersCache = APP.allUsersCache.filter(function(u) { return u.id !== idUser; });
        renderUsersByActiveRole();
        showToast('Akun ' + namaUser + ' dihapus (Mode Preview).', 'info');
      }
    });
  }

  function handleToggleUser(idUser) {
    if (IS_GAS) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            showToast(res.message, 'success');
            loadUsersList();
          }
        })
        .toggleUserStatus(String(idUser));
    } else {
      for (var i = 0; i < APP.allUsersCache.length; i++) {
        if (APP.allUsersCache[i].id === idUser) {
          APP.allUsersCache[i].status = (APP.allUsersCache[i].status === 'Aktif') ? 'Nonaktif' : 'Aktif';
          break;
        }
      }
      renderUsersByActiveRole();
      showToast('Status pengguna diperbarui (Mode Preview).', 'info');
    }
  }

  function renderStatusBadge(status) {
    var s = String(status || '-');
    var cls = 'bg-slate-100 text-slate-700';
    if (s === 'Hadir' || s === 'Tervalidasi') cls = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
    else if (s === 'Terlambat' || s === 'Menunggu') cls = 'bg-amber-50 text-amber-700 border border-amber-200';
    else if (s === 'Izin') cls = 'bg-blue-50 text-blue-700 border border-blue-200';
    else if (s === 'Sakit') cls = 'bg-purple-50 text-purple-700 border border-purple-200';
    else if (s === 'Alpha' || s === 'Ditolak') cls = 'bg-rose-50 text-rose-700 border border-rose-200';
    return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ' + cls + '">' + esc(s) + '</span>';
  }

  window.addEventListener('DOMContentLoaded', function() {
    bindConfirmButton();
    startRealtimeClock();
    var today = getTodayISO();
    var jurnalTgl = document.getElementById('jurnal-tanggal');
    var periodikTgl = document.getElementById('periodik-tanggal');
    if (jurnalTgl) jurnalTgl.value = today;
    if (periodikTgl) periodikTgl.value = today;
    populateKelasDropdowns();
  });
</script>
